    #
    # - name: Set executable bit on hg and chg binaries again to work around download-artifact bug
    #   run: chmod +x linux-x64/Mercurial/hg linux-x64/Mercurial/chg

    - name: Nuget pack
      run: dotnet build build/SIL.Chorus.Mercurial.proj -property:PreRelease="$releasesuffix" -property:BuildCounter=${{ github.run_number }}

    - name: ls
      run: ls -lR

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ./**/*.nupkg
        if-no-files-found: error

    - name: Publish nuget packages
      if: github.event_name == 'push'
      run: |
        dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/NAMESPACE/index.json"
        dotnet nuget push **/*.nupkg -Source github -ApiKey ${{ secrets.GITHUB_TOKEN }}
